name: Build RemoteSupport

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  release: { types: [published] }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Build single-file app and smoke-test it
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteSupport-${{ runner.os }}
          path: dist/*
