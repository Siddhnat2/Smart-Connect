# On a VPS with a domain name pointing at it (e.g. support.example.com):
#   1. edit deploy/Caddyfile (your domain)   2. echo "RS_RELAY_KEY=$(openssl rand -hex 24)" > .env
#   3. docker compose -f deploy/docker-compose.yml up -d --build
# Caddy obtains + renews the TLS certificate automatically => clients connect via wss://
services:
  relay:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      RS_RELAY_KEY: ${RS_RELAY_KEY}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
